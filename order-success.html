<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success - BiteBliss</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fas fa-utensils"></i> BiteBliss</a>
        </div>
    </nav>

    <main class="py-5" style="min-height: 80vh; display: flex; align-items: center;">
        <div class="container text-center">
            <div class="card border-0 shadow-lg p-5 rounded-4 mx-auto" style="max-width: 500px;">
                <i class="fas fa-check-circle text-success mb-4" style="font-size: 80px;"></i>
                <h2 class="fw-bold mb-3">Order Placed!</h2>
                <p class="text-muted mb-4">Your order #ORD-84739 has been confirmed and is being prepared by our restaurant.</p>
                
                <div class="bg-light p-3 rounded-3 mb-4 text-start">
                    <p class="mb-1"><span class="fw-bold">Total Paid:</span> ₹394</p>
                    <p class="mb-0"><span class="fw-bold">Est. Delivery:</span> 35-45 mins</p>
                </div>

                <div class="d-grid gap-3">
                    <a href="track-order.html" class="btn btn-primary btn-lg rounded-pill fw-bold">Track Order</a>
                    <a href="index.html" class="btn btn-outline-secondary btn-lg rounded-pill">Back to Home</a>
                </div>
            </div>
        </div>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
